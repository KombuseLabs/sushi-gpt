<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="541" viewBox="0 0 1510 541" role="img" aria-labelledby="title description">
  <title id="title">One conversation. The right tool for each task.</title>
  <desc id="description">Vision for SushiGPT: one conversational agent in the native Codex runtime coordinates native child agents with independently selected models and execution routes. A separate voice frontend connects the user to the conversation. Optional Jev classification guides configured model selection based on task fit, capabilities, quality, preferences, resources, and cost. Example routes branch into model choices: Claude through Claude Code execution to Claude Sonnet or Claude Opus; local deployment to Qwen3 or Gemma; the OpenRouter gateway to Gemini or DeepSeek; the OpenAI provider to GPT-6 Astra or GPT-6 Sol. These routes are illustrative, and model families may be available through multiple routes. This is an intended direction, not a list of currently supported integrations or a demonstrated optimizer. See the README Status section for current capabilities and verification limits.</desc>
