name: sdk

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk-installation:
    # Optional JSON override accepts a label, label array, or runner-group object.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the installed Python SDK and its default runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/build
              /tmp/build/bin/python -m pip install uv==0.11.3
              /tmp/build/bin/uv build --wheel --out-dir /tmp/dist
              python -m venv /tmp/installed
              /tmp/build/bin/uv pip install --python /tmp/installed/bin/python /tmp/dist/*.whl
              env -u PYTHONPATH -u CODEX_EXEC_PATH /tmp/installed/bin/python tests/installed_sdk_smoke.py
            '

  sdks:
    # Optional JSON override accepts a label, label array, or runner-group object.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-24.04"') }}
    # Cold local builds need room before cache persistence and SDK validation.
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux bwrap build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare Bazel CI
        id: setup_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: sdk

      - name: Configure SDK action cache
        id: action_cache
        env:
          CACHE_FINGERPRINT: ${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'codex-rs/Cargo.lock', '.github/scripts/run-bazel-ci.sh', '.github/scripts/run_bazel_with_buildbuddy.py') }}
          RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cache_path="$HOME/.cache/bazel-disk-cache"
          cache_prefix="sdk-actions-v1-${ImageOS:-linux}-${ImageVersion:-unknown}-${RUNNER_ARCH}-${CACHE_FINGERPRINT}-"
          mkdir -p "$cache_path" "${RUNNER_TEMP}/sdk-bazel-diagnostics"
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
          echo "prefix=$cache_prefix" >> "$GITHUB_OUTPUT"
          # Rotate immutable keys so failed cold builds can advance the cache.
          echo "key=${cache_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore SDK action cache
        id: restore_action_cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.action_cache.outputs.path }}
          key: ${{ steps.action_cache.outputs.key }}
          restore-keys: ${{ steps.action_cache.outputs.prefix }}

      - name: Build codex and the code-mode host with Bazel
        id: build_bazel
        timeout-minutes: 45
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the shared CI wrapper so fork PRs fall back cleanly when
          # BuildBuddy credentials are unavailable. This workflow needs the
          # built binaries on disk afterwards, so ask the wrapper to override
          # CI's default remote_download_minimal behavior.
          # Exit as a normal failure before GitHub cancels the step, leaving
          # time to save completed actions and diagnostics. Preserve pipefail.
          timeout --signal=INT --kill-after=30s 44m \
            ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            -- \
            build \
            --profile="${RUNNER_TEMP}/sdk-bazel-diagnostics/build-profile.json.gz" \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=sdk \
            -- \
            //codex-rs/cli:codex \
            //codex-rs/code-mode-host:codex-code-mode-host \
            2>&1 | tee "${RUNNER_TEMP}/sdk-bazel-diagnostics/build.log"

          cquery_output="$(
            ./.github/scripts/run-bazel-ci.sh \
              -- \
              cquery \
              --output=files \
              -- \
              'set(//codex-rs/cli:codex //codex-rs/code-mode-host:codex-code-mode-host)' \
              | grep -E '^(/|bazel-out/)'
          )"
          mapfile -t bazel_output_paths <<< "${cquery_output}"
          if [[ ${#bazel_output_paths[@]} -ne 2 ]]; then
            echo "Expected both Bazel-built binaries, found ${#bazel_output_paths[@]}." >&2
            exit 1
          fi

          # Stage both binaries together so the CLI can discover its sibling
          # code-mode host while the SDK tests spawn the CLI directly.
          install_dir="${GITHUB_WORKSPACE}/.tmp/sdk-ci"
          mkdir -p "${install_dir}"
          install -m 755 "${bazel_output_paths[@]}" "${install_dir}"
          echo "CODEX_EXEC_PATH=${install_dir}/codex" >> "$GITHUB_ENV"

      - name: Record SDK cache and build outcome
        id: cache_metrics
        if: always() && !cancelled() && (steps.build_bazel.outcome == 'success' || steps.build_bazel.outcome == 'failure')
        timeout-minutes: 1
        continue-on-error: true
        env:
          CACHE_PATH: ${{ steps.action_cache.outputs.path }}
          CACHE_MATCH: ${{ steps.restore_action_cache.outputs.cache-matched-key }}
          CACHE_KEY: ${{ steps.action_cache.outputs.key }}
          BUILD_OUTCOME: ${{ steps.build_bazel.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cache_kib=$(du -sk "$CACHE_PATH" | cut -f1)
          # Bound this pilot's cache generation without changing storage quotas.
          if (( cache_kib <= 5 * 1024 * 1024 )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SDK action cache exceeds 5 GiB; skipping this generation."
          fi
          {
            echo "Build outcome: $BUILD_OUTCOME"
            echo "Restored action cache: ${CACHE_MATCH:-miss}"
            echo "Action cache generation: $CACHE_KEY"
            echo "Action cache size (KiB): $cache_kib"
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "Source: $GITHUB_SHA"
          } | tee "${RUNNER_TEMP}/sdk-bazel-diagnostics/cache.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SDK Bazel diagnostics
        if: always() && !cancelled() && (steps.build_bazel.outcome == 'success' || steps.build_bazel.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sdk-bazel-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-bazel-diagnostics
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Save SDK action cache
        if: always() && !cancelled() && steps.cache_metrics.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.action_cache.outputs.path }}
          key: ${{ steps.action_cache.outputs.key }}

      - name: Save bazel repository cache
        if: always() && !cancelled() && (steps.build_bazel.outcome == 'success' || steps.build_bazel.outcome == 'failure') && steps.setup_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
          key: ${{ steps.setup_bazel.outputs.repository-cache-key }}

      - name: Warm up Bazel-built codex
        shell: bash
        run: |
          set -euo pipefail
          "${CODEX_EXEC_PATH}" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter ./sdk/typescript run build

      - name: Lint SDK packages
        run: pnpm -r --filter ./sdk/typescript run lint

      - name: Test SDK packages
        run: pnpm -r --filter ./sdk/typescript run test

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Test Python SDK against the same CLI
        working-directory: sdk/python
        run: |
          uv sync --only-group dev --frozen
          uv run --only-group dev --frozen --no-sync ruff check --output-format=github .
          uv run --only-group dev --frozen --no-sync ruff format --check .
          uv run --only-group dev --frozen --no-sync pytest

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
